<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Kitsunet Homelab Architecture</title>
    <script>
      const params = new URLSearchParams(window.location.search);
      const requested = params.get("lang");
      const locale = requested === "zh-TW" || requested === "ja" ? requested : "en";
      params.delete("lang");
      const query = params.toString();
      window.location.replace(
        `./kitsunet-homelab.${locale}.html${query ? `?${query}` : ""}${window.location.hash}`
      );
    </script>
  </head>
  <body>
    <p>Explore the updated Kitsunet Homelab architecture:</p>
    <nav aria-label="Diagram language">
      <a href="./kitsunet-homelab.en.html">English</a>
      <a href="./kitsunet-homelab.zh-TW.html" lang="zh-TW">繁體中文</a>
      <a href="./kitsunet-homelab.ja.html" lang="ja">日本語</a>
    </nav>
  </body>
</html>
