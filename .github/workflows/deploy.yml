name: Build and Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: production-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  secure-deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write

    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/kitsunezu-portfolio
      LOCAL_IMAGE: kitsunezu-portfolio:${{ github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build application
        run: npm run build

      # Production dependency policy: High and Critical findings block deployment.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build candidate image
        run: docker build --build-arg BUILD_REVISION="$GITHUB_SHA" --tag "$LOCAL_IMAGE" .

      # Image policy: all fixed and unfixed High/Critical findings block deployment.
      - name: Scan candidate image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.LOCAL_IMAGE }}
          format: table
          exit-code: "1"
          ignore-unfixed: false
          vuln-type: os,library
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Reject stale production commits
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          current_revision="$(curl --fail --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            --header "Authorization: Bearer $GH_TOKEN" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/heads/master" | jq -er '.object.sha')"
          if [ "$current_revision" != "$EXPECTED_REVISION" ]; then
            echo "::error::A newer production commit exists; this run must not publish or deploy an older release"
            exit 1
          fi

      - name: Push verified image
        run: |
          short_sha="${GITHUB_SHA::7}"
          docker tag "$LOCAL_IMAGE" "$IMAGE_NAME:latest"
          docker tag "$LOCAL_IMAGE" "$IMAGE_NAME:$short_sha"
          docker push "$IMAGE_NAME:latest"
          docker push "$IMAGE_NAME:$short_sha"

      - name: Connect to Kitsunet over Tailscale
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:kitsunet-deploy
          ping: 192.168.1.5
          args: --accept-routes
          version: 1.94.2

      - name: Deploy to Coolify
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_DEPLOY_TOKEN }}
          COOLIFY_URL: http://192.168.1.5:8000
          COOLIFY_SERVICE_UUID: "qm6hv31itwbshrhetrrqhm2u"
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          status="$(curl --silent --show-error \
            --connect-timeout 10 --max-time 60 \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer $COOLIFY_API_TOKEN" \
            "$COOLIFY_URL/api/v1/deploy?uuid=$COOLIFY_SERVICE_UUID&force=false")"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::Coolify deploy request failed (HTTP $status)"
            exit 1
          fi
          if ! jq --exit-status --arg uuid "$COOLIFY_SERVICE_UUID" '
            .deployments | length == 1 and
            .[0].resource_uuid == $uuid and
            (.[0].message | startswith("Service ") and
              endswith(" started. It could take a while, be patient."))
          ' "$response_file" >/dev/null 2>&1; then
            echo "::error::Coolify did not confirm a start request for the expected service"
            exit 1
          fi
          echo "Coolify accepted deployment request for commit $GITHUB_SHA"

      - name: Verify the deployed release
        timeout-minutes: 12
        env:
          EXPECTED_REVISION: ${{ github.sha }}
          RELEASE_URLS: |
            https://kitsunezu.com/deployment-version.json
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 600))
          while (( SECONDS < deadline )); do
            ready=true
            while IFS= read -r url; do
              [ -n "$url" ] || continue
              if ! curl --fail --silent --show-error --connect-timeout 5 --max-time 10 \
                --header 'Cache-Control: no-cache' \
                "$url?revision=$EXPECTED_REVISION&attempt=$SECONDS" \
                | jq --exit-status --arg revision "$EXPECTED_REVISION" '
                  .revision == $revision and .ok != false and
                  .status != "degraded" and .model_loaded != false and .db_connected != false
                ' >/dev/null 2>&1; then
                ready=false
                break
              fi
            done <<< "$RELEASE_URLS"
            if [ "$ready" = true ]; then
              echo "Public endpoints are healthy and serve revision $EXPECTED_REVISION"
              exit 0
            fi
            sleep 5
          done
          echo "::error::The expected release did not become healthy within 10 minutes"
          exit 1
